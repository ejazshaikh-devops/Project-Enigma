# GuardAI — nginx reverse proxy config
#
# Sits in front of the GuardAI backend Docker container (running on
# 127.0.0.1:8000) and handles: HTTPS termination, connection/rate limiting
# at the edge (before requests even reach your app), and basic DoS
# protection so a traffic spike degrades gracefully instead of crashing
# the container.
#
# Install location: /etc/nginx/sites-available/guardai
# Enable with: sudo ln -s /etc/nginx/sites-available/guardai /etc/nginx/sites-enabled/

# ── Rate/connection limiting zones (shared memory, defined once at top level) ──
# Place these two lines in /etc/nginx/nginx.conf inside the `http {}` block
# if your distro's nginx.conf doesn't already include sites-available configs
# inside http{}. See install_ec2.sh for exact placement.
#
# limit_req_zone $binary_remote_addr zone=guardai_req:10m rate=10r/s;
# limit_conn_zone $binary_remote_addr zone=guardai_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.guardai.io;   # ← replace with your real domain or EC2 public DNS

    # Certbot will rewrite this block to redirect to HTTPS automatically.
    # Until you run certbot, this serves plain HTTP for initial testing.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

